document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

erif;font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.03em;color:rgba(255,255,255,.95)\">Your brand, on shelves<br>across <span style=\"color:#14A89B\">Kerala</span>.</h1>\n        <p style=\"margin:28px 0 0;max-width:520px;font-size:19px;line-height:1.55;color:rgba(255,255,255,.72)\">SahiReach LLP moves FMCG brands from depot to district. We hold the stock, fund the pipeline and run the distributor network so your brand reaches retail without you building a state operation from scratch.</p>\n        <div style=\"display:flex;flex-wrap:wrap;gap:14px;margin-top:38px\">\n          <a href=\"#contact\" style=\"display:inline-flex;align-items:center;gap:10px;background:#14A89B;color:#04171F;padding:16px 28px;border-radius:100px;font-weight:800;font-size:15.5px\">Start a partnership conversation <span>\u2192</span></a>\n          <a href=\"#model\" style=\"display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.28);color:#fff;padding:16px 26px;border-radius:100px;font-weight:700;font-size:15.5px\">See how we operate</a>\n        </div>\n      </div>\n      <div style=\"display:flex;flex-direction:column;gap:18px;padding-bottom:6px\">\n        <div style=\"border-top:1px solid rgba(255,255,255,.16);padding-top:16px\">\n          <div style=\"font-family:'Archivo',sans-serif;font-size:15px;font-weight:700;color:#fff\">Currently super stockist for</div>\n          <div style=\"font-family:'Archivo',sans-serif;font-size:34px;font-weight:800;letter-spacing:-.02em;color:#14A89B;margin-top:4px\">Hangyo Ice Creams</div>\n          <div style=\"font-size:13.5px;color:rgba(255,255,255,.6);margin-top:6px\">Frozen, temperature-controlled, high-velocity. The hardest category to distribute and the one we run every day.</div>\n        </div>\n        <div style=\"border-top:1px solid rgba(255,255,255,.16);padding-top:16px\">\n          <div style=\"font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)\">Now open to</div>\n          <div style=\"font-size:16.5px;line-height:1.5;color:rgba(255,255,255,.85);margin-top:8px\">Food &amp; beverage \u00b7 Dairy &amp; frozen \u00b7 Home and personal care \u00b7 Packaged staples</div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section style=\"background:#0E7F76;color:#fff\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:22px 32px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 28px;font-size:14px;font-weight:700;letter-spacing:.04em\">\n      <span>COLD-CHAIN CAPABLE</span>\n      <span style=\"border-left:1px solid rgba(255,255,255,.3);padding-left:28px\">WAREHOUSE IN KOCHI</span>\n      <span style=\"border-left:1px solid rgba(255,255,255,.3);padding-left:28px\">ESTABLISHED DISTRIBUTOR NETWORK</span>\n      <span style=\"border-left:1px solid rgba(255,255,255,.3);padding-left:28px\">GST + FSSAI REGISTERED</span>\n    </div>\n  </section>\n\n  <section id=\"model\" style=\"max-width:1180px;margin:0 auto;padding:104px 32px 0\">\n    <div style=\"display:grid;grid-template-columns:.85fr 1.15fr;gap:64px;align-items:start\">\n      <div>\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0E7F76\">What a super stockist does</div>\n        <h2 style=\"margin:16px 0 0;font-family:'Archivo',sans-serif;font-weight:800;font-size:46px;line-height:1.02;letter-spacing:-.03em\">One partner between<br>your depot and<br>Kerala's retail counter.</h2>\n        <p style=\"margin:22px 0 0;font-size:17px;line-height:1.6;color:rgba(8,32,47,.66)\">You ship to one address, raise one invoice and hold one relationship. Everything downstream \u2014 breaking bulk, credit to distributors, coverage, claims and reporting \u2014 sits with us.</p>\n      </div>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px\">\n        <div style=\"background:#fff;border:1px solid rgba(8,32,47,.09);border-radius:16px;padding:26px\">\n          <div style=\"font-family:'Archivo',sans-serif;font-size:13px;font-weight:800;color:#14A89B\">01</div>\n          <div style=\"font-family:'Archivo',sans-serif;font-size:19px;font-weight:700;margin-top:10px;letter-spacing:-.01em\">Bulk in</div>\n          <p style=\"margin:8px 0 0;font-size:14.5px;line-height:1.55;color:rgba(8,32,47,.62)\">Your plant or CFA ships full loads to our Kochi facility. We take ownership of the stock.</p>\n        </div>\n        <div style=\"background:#fff;border:1px solid rgba(8,32,47,.09);border-radius:16px;padding:26px\">\n          <div style=\"font-family:'Archivo',sans-serif;font-size:13px;font-weight:800;color:#14A89B\">02</div>\n          <div style=\"font-family:'Archivo',sans-serif;font-size:19px;font-weight:700;margin-top:10px;letter-spacing:-.01em\">Held right</div>\n          <p style=\"margin:8px 0 0;font-size:14.5px;line-height:1.55;color:rgba(8,32,47,.62)\">Stored to category norms, including frozen and chilled, with batch and expiry discipline.</p>\n        </div>\n        <div style=\"background:#fff;border:1px solid rgba(8,32,47,.09);border-radius:16px;padding:26px\">\n          <div style=\"font-family:'Archivo',sans-serif;font-size:13px;font-weight:800;color:#14A89B\">03</div>\n          <div style=\"font-family:'Archivo',sans-serif;font-size:19px;font-weight:700;margin-top:10px;letter-spacing:-.01em\">Broken to district</div>\n          <p style=\"margin:8px 0 0;font-size:14.5px;line-height:1.55;color:rgba(8,32,47,.62)\">We appoint distributors district by district, and settle their claims.</p>\n        </div>\n        <div style=\"background:#08202F;color:#fff;border-radius:16px;padding:26px\">\n          <div style=\"font-family:'Archivo',sans-serif;font-size:13px;font-weight:800;color:#14A89B\">04</div>\n          <div style=\"font-family:'Archivo',sans-serif;font-size:19px;font-weight:700;margin-top:10px;letter-spacing:-.01em\">Reported back</div>\n          <p style=\"margin:8px 0 0;font-size:14.5px;line-height:1.55;color:rgba(255,255,255,.68)\">Secondary sales, stock cover and market feedback come back to your team in your format.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"capabilities\" style=\"max-width:1180px;margin:0 auto;padding:104px 32px 0\">\n    <div style=\"display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;border-bottom:1px solid rgba(8,32,47,.12);padding-bottom:18px\">\n      <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-weight:800;font-size:40px;letter-spacing:-.03em\">Capabilities</h2>\n      <span style=\"font-size:15px;color:rgba(8,32,47,.55)\">What we already have running, today.</span>\n    </div>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:0\">\n      <div style=\"padding:34px 28px 34px 0;border-right:1px solid rgba(8,32,47,.1)\">\n        <div style=\"width:34px;height:34px;border-radius:9px;background:#14A89B\"></div>\n        <div style=\"font-family:'Archivo',sans-serif;font-size:21px;font-weight:700;margin-top:18px;letter-spacing:-.015em\">Cold chain</div>\n        <p style=\"margin:10px 0 0;font-size:14.5px;line-height:1.6;color:rgba(8,32,47,.64)\">Freezer and chilled capacity built for ice cream \u2014 the strictest standard in FMCG. Frozen, dairy and chilled brands plug straight in.</p>\n      </div>\n      <div style=\"padding:34px 28px;border-right:1px solid rgba(8,32,47,.1)\">\n        <div style=\"width:34px;height:34px;border-radius:9px;background:#08202F\"></div>\n        <div style=\"font-family:'Archivo',sans-serif;font-size:21px;font-weight:700;margin-top:18px;letter-spacing:-.015em\">Kochi warehouse</div>\n        <p style=\"margin:10px 0 0;font-size:14.5px;line-height:1.6;color:rgba(8,32,47,.64)\">Central Kerala base at Chittoor Road, Kochi \u2014 within a day's reach of the state's main trade corridors.</p>\n      </div>\n      <div style=\"padding:34px 28px;border-right:1px solid rgba(8,32,47,.1)\">\n        <div style=\"width:34px;height:34px;border-radius:9px;background:#14A89B\"></div>\n        <div style=\"font-family:'Archivo',sans-serif;font-size:21px;font-weight:700;margin-top:18px;letter-spacing:-.015em\">Distributor network</div>\n        <p style=\"margin:10px 0 0;font-size:14.5px;line-height:1.6;color:rgba(8,32,47,.64)\">Working relationships with appointed distributors across our operating districts, with credit and claim handling managed by us.</p>\n      </div>\n      <div style=\"padding:34px 0 34px 28px\">\n        <div style=\"width:34px;height:34px;border-radius:9px;background:#08202F\"></div>\n        <div style=\"font-family:'Archivo',sans-serif;font-size:21px;font-weight:700;margin-top:18px;letter-spacing:-.015em\">Compliant</div>\n        <p style=\"margin:10px 0 0;font-size:14.5px;line-height:1.6;color:rgba(8,32,47,.64)\">GST and FSSAI registered, with documentation and audit trails a national brand's finance team can work with.</p>\n      </div>\n    </div>\n    \n  </section>\n\n  <section id=\"coverage\" style=\"max-width:1180px;margin:0 auto;padding:104px 32px 0\">\n    <div style=\"background:#fff;border:1px solid rgba(8,32,47,.09);border-radius:22px;overflow:hidden;display:grid;grid-template-columns:.8fr 1.2fr\">\n      <div style=\"padding:46px 42px\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0E7F76\">Coverage</div>\n        <h2 style=\"margin:14px 0 0;font-family:'Archivo',sans-serif;font-weight:800;font-size:40px;line-height:1.05;letter-spacing:-.03em\">Built out of Kochi,<br>reaching the state.</h2>\n        <p style=\"margin:18px 0 0;font-size:16.5px;line-height:1.6;color:rgba(8,32,47,.66)\">Our head office and stocking point sit in Kochi, the natural centre of Kerala's trade routes. From here we service districts north and south, and extend coverage as a brand's volumes justify it.</p>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:26px\">\n          <span style=\"font-size:13px;font-weight:700;background:#08202F;color:#fff;padding:7px 13px;border-radius:100px\">Ernakulam \u00b7 HQ</span>\n          <span style=\"font-size:13px;font-weight:600;background:rgba(8,32,47,.06);padding:7px 13px;border-radius:100px\">Thiruvananthapuram</span>\n          <span style=\"font-size:13px;font-weight:600;background:rgba(8,32,47,.06);padding:7px 13px;border-radius:100px\">Kollam</span>\n          <span style=\"font-size:13px;font-weight:600;background:rgba(8,32,47,.06);padding:7px 13px;border-radius:100px\">Alappuzha</span>\n          <span style=\"font-size:13px;font-weight:600;background:rgba(8,32,47,.06);padding:7px 13px;border-radius:100px\">Kottayam</span>\n          <span style=\"font-size:13px;font-weight:600;background:rgba(8,32,47,.06);padding:7px 13px;border-radius:100px\">Thrissur</span>\n          <span style=\"font-size:13px;font-weight:600;background:rgba(8,32,47,.06);padding:7px 13px;border-radius:100px\">Palakkad</span>\n          <span style=\"font-size:13px;font-weight:600;background:rgba(8,32,47,.06);padding:7px 13px;border-radius:100px\">Malappuram</span>\n          <span style=\"font-size:13px;font-weight:600;background:rgba(8,32,47,.06);padding:7px 13px;border-radius:100px\">Kozhikode</span>\n          <span style=\"font-size:13px;font-weight:600;background:rgba(8,32,47,.06);padding:7px 13px;border-radius:100px\">Kannur</span>\n          <span style=\"font-size:13px;font-weight:600;background:rgba(8,32,47,.06);padding:7px 13px;border-radius:100px\">Kasaragod</span>\n        </div>\n        \n      </div>\n      <div style=\"min-height:460px;border-left:1px solid rgba(8,32,47,.09)\">\n        <iframe src=\"about:blank#da1f54aa-96fe-490c-aa3a-14cb081d046f\" title=\"SahiReach coverage across Kerala\" style=\"width:100%;height:100%;min-height:460px;border:0;display:block\"></iframe>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"brands\" style=\"max-width:1180px;margin:0 auto;padding:104px 32px 0\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px\">\n      <div style=\"background:#08202F;color:#fff;border-radius:22px;padding:46px 42px;position:relative;overflow:hidden\">\n        <div style=\"position:absolute;right:-90px;bottom:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(20,168,155,.4),rgba(20,168,155,0) 65%)\"></div>\n        <div style=\"position:relative\">\n          <div style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7FE3D8\">On the ground since day one</div>\n          <h2 style=\"margin:16px 0 0;font-family:'Archivo',sans-serif;font-weight:800;font-size:40px;line-height:1.05;letter-spacing:-.03em\">Hangyo Ice Creams</h2>\n          <p style=\"margin:18px 0 0;font-size:16.5px;line-height:1.6;color:rgba(255,255,255,.72)\">We are the appointed super stockist for Hangyo in Kerala. Frozen distribution leaves no room for slack: stock moves fast, temperature never breaks, and a missed delivery is a lost sale that day. Running it well is our proof of capability for every brand that comes next.</p>\n          <div style=\"display:flex;flex-wrap:wrap;gap:26px;margin-top:32px;padding-top:24px;border-top:1px solid rgba(255,255,255,.16)\">\n            <div><div style=\"font-family:'Archivo',sans-serif;font-size:15px;font-weight:700\">Frozen</div><div style=\"font-size:13px;color:rgba(255,255,255,.55)\">Category</div></div>\n            <div><div style=\"font-family:'Archivo',sans-serif;font-size:15px;font-weight:700\">South Kerala</div><div style=\"font-size:13px;color:rgba(255,255,255,.55)\">Territory</div></div>\n            <div><div style=\"font-family:'Archivo',sans-serif;font-size:15px;font-weight:700\">Super stockist</div><div style=\"font-size:13px;color:rgba(255,255,255,.55)\">Our role</div></div>\n          </div>\n        </div>\n      </div>\n      <div style=\"border:1.5px dashed rgba(8,32,47,.22);border-radius:22px;padding:46px 42px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,rgba(20,168,155,.07),rgba(20,168,155,0))\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0E7F76\">Open slot</div>\n        <h2 style=\"margin:16px 0 0;font-family:'Archivo',sans-serif;font-weight:800;font-size:40px;line-height:1.05;letter-spacing:-.03em\">Your brand here.</h2>\n        <p style=\"margin:18px 0 0;font-size:16.5px;line-height:1.6;color:rgba(8,32,47,.66)\">We have capacity for additional non-competing FMCG principals in Kerala. If you are launching in the state, or replacing an underperforming stockist, we should talk.</p>\n        <a href=\"#contact\" style=\"display:inline-flex;align-items:center;gap:10px;margin-top:30px;align-self:flex-start;background:#08202F;color:#fff;padding:15px 26px;border-radius:100px;font-weight:800;font-size:15px\">Send an enquiry <span>\u2192</span></a>\n      </div>\n    </div>\n  </section>\n\n  <section style=\"max-width:1180px;margin:0 auto;padding:104px 32px 0\">\n    <div style=\"display:grid;grid-template-columns:.85fr 1.15fr;gap:64px;align-items:start\">\n      <div>\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0E7F76\">Why partner with us</div>\n        <h2 style=\"margin:16px 0 0;font-family:'Archivo',sans-serif;font-weight:800;font-size:46px;line-height:1.02;letter-spacing:-.03em\">A young firm<br>that answers<br>the phone.</h2>\n      </div>\n      <div>\n        <div style=\"display:flex;gap:22px;padding:26px 0;border-top:1px solid rgba(8,32,47,.12)\">\n          <div style=\"font-family:'Archivo',sans-serif;font-size:14px;font-weight:800;color:#14A89B;min-width:26px\">01</div>\n          <div><div style=\"font-family:'Archivo',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.015em\">Frozen-grade discipline, any category</div><p style=\"margin:8px 0 0;font-size:15.5px;line-height:1.6;color:rgba(8,32,47,.64)\">If a network can hold ice cream, ambient and personal care are straightforward. Our routines were built to the hardest standard.</p></div>\n        </div>\n        <div style=\"display:flex;gap:22px;padding:26px 0;border-top:1px solid rgba(8,32,47,.12)\">\n          <div style=\"font-family:'Archivo',sans-serif;font-size:14px;font-weight:800;color:#14A89B;min-width:26px\">02</div>\n          <div><div style=\"font-family:'Archivo',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.015em\">Owner-run, decisions same day</div><p style=\"margin:8px 0 0;font-size:15.5px;line-height:1.6;color:rgba(8,32,47,.64)\">You deal directly with the managing partner. No layers between a market problem and the person who can fix it.</p></div>\n        </div>\n        <div style=\"display:flex;gap:22px;padding:26px 0;border-top:1px solid rgba(8,32,47,.12)\">\n          <div style=\"font-family:'Archivo',sans-serif;font-size:14px;font-weight:800;color:#14A89B;min-width:26px\">03</div>\n          <div><div style=\"font-family:'Archivo',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.015em\">We carry the working capital</div><p style=\"margin:8px 0 0;font-size:15.5px;line-height:1.6;color:rgba(8,32,47,.64)\">Stock is bought, not consigned. Distributor credit sits on our books, so your receivables stay clean.</p></div>\n        </div>\n        <div style=\"display:flex;gap:22px;padding:26px 0;border-top:1px solid rgba(8,32,47,.12);border-bottom:1px solid rgba(8,32,47,.12)\">\n          <div style=\"font-family:'Archivo',sans-serif;font-size:14px;font-weight:800;color:#14A89B;min-width:26px\">04</div>\n          <div><div style=\"font-family:'Archivo',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.015em\">Kerala is all we do</div><p style=\"margin:8px 0 0;font-size:15.5px;line-height:1.6;color:rgba(8,32,47,.64)\">One state, understood properly \u2014 trade patterns, seasonality, local formats and the people who run them.</p></div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section style=\"max-width:1180px;margin:0 auto;padding:104px 32px 0\">\n    \n  </section>\n\n  \n\n  <section id=\"contact\" style=\"max-width:1180px;margin:0 auto;padding:104px 32px 0\">\n    <div style=\"background:#08202F;color:#fff;border-radius:24px;overflow:hidden;display:grid;grid-template-columns:1fr .9fr\">\n      <div style=\"padding:52px 46px\">\n        <div style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7FE3D8\">Brand partnership enquiry</div>\n        <h2 style=\"margin:14px 0 0;font-family:'Archivo',sans-serif;font-weight:800;font-size:42px;line-height:1.03;letter-spacing:-.03em\">Tell us what you<br>want to move.</h2>\n        <p style=\"margin:16px 0 0;max-width:440px;font-size:16px;line-height:1.6;color:rgba(255,255,255,.68)\">A few lines about your brand, category and target districts is enough to start. We\u2019ll follow up at hello@sahireach.com.</p>\n        <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"margin-top:32px;display:grid;gap:14px;max-width:460px\">\n          <input name=\"name\" placeholder=\"Your name\" required=\"\" style=\"background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:14px 16px;color:#fff;font-size:15px;outline:none\" style-focus=\"border-color:#14A89B\">\n          <input name=\"company\" placeholder=\"Company / brand\" required=\"\" style=\"background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:14px 16px;color:#fff;font-size:15px;outline:none\" style-focus=\"border-color:#14A89B\">\n          <input name=\"email\" type=\"email\" placeholder=\"Work email\" required=\"\" style=\"background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:14px 16px;color:#fff;font-size:15px;outline:none\" style-focus=\"border-color:#14A89B\">\n          <sc-raw-select name=\"category\" style=\"background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:14px 16px;color:#fff;font-size:15px;outline:none\" style-focus=\"border-color:#14A89B\">\n            <option style=\"color:#08202F\">Category \u2014 frozen / ice cream</option>\n            <option style=\"color:#08202F\">Category \u2014 dairy &amp; chilled</option>\n            <option style=\"color:#08202F\">Category \u2014 food &amp; beverage (ambient)</option>\n            <option style=\"color:#08202F\">Category \u2014 home &amp; personal care</option>\n            <option style=\"color:#08202F\">Category \u2014 other FMCG</option>\n          </sc-raw-select>\n          <textarea name=\"message\" rows=\"4\" placeholder=\"What you're looking for in Kerala\" style=\"background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:14px 16px;color:#fff;font-size:15px;outline:none;resize:vertical\" style-focus=\"border-color:#14A89B\"></textarea>\n          <button type=\"submit\" style=\"margin-top:4px;justify-self:start;background:#14A89B;color:#04171F;border:0;padding:16px 30px;border-radius:100px;font-weight:800;font-size:15.5px;cursor:pointer\" style-hover=\"background:#7FE3D8\">Send enquiry \u2192</button>\n          <div style=\"font-size:13px;color:rgba(255,255,255,.5)\">{{ formNote }}</div>\n        </form>\n      </div>\n      <div style=\"background:rgba(255,255,255,.04);border-left:1px solid rgba(255,255,255,.1);padding:52px 46px;display:flex;flex-direction:column;gap:30px\">\n        <div>\n          <div style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45)\">Office</div>\n          <div style=\"font-family:'Archivo',sans-serif;font-size:19px;font-weight:700;line-height:1.45;margin-top:10px\">1st Floor, Sreepadam<br>Chittoor Road<br>Kochi 682018, Kerala</div>\n        </div>\n        <div>\n          <div style=\"font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.4 ",\n      sending: \"Sending\\u2026\",\n      sent: \"Thanks \\u2014 we\\u2019ve received your enquiry and will get back to you.\",\n      error: \"Something went wrong sending that. Please email hello@sahireach.com directly.\"\n    };\n    return {\n      formNote: notes[this.state.status] || notes.idle,\n      onSubmit: async (e) => {\n        e.preventDefault();\n        if (this.state.status === \"sending\") return;\n        const f = e.target;\n        const g = (n) => (f.elements[n] && f.elements[n].value) || \"\";\n        this.setState({ status: \"sending\" });\n        try {\n          const res = await fetch(SUPABASE_URL + \"/rest/v1/enquiries\", {\n            method: \"POST\",\n            headers: {\n              \"Content-Type\": \"application/json\",\n              \"apikey\": SUPABASE_ANON_KEY,\n              \"Authorization\": \"Bearer \" + SUPABASE_ANON_KEY,\n              \"Prefer\": \"return=minimal\"\n            },\n            body: JSON.stringify({\n              name: g(\"name\"),\n              company: g(\"company\"),\n              email: g(\"email\"),\n              category: g(\"category\"),\n              message: g(\"message\")\n            })\n          });\n          if (!res.ok) throw new Error(\"request failed: \" + res.status);\n          this.setState({ status: \"sent\" });\n          f.reset();\n        } catch (err) {\n          console.error(\"enquiry submit failed\", err);\n          this.setState({ status: \"error\" });\n        }\n      }\n    };\n  }\n}\n<\/script>\n\n\n</body></html>"
